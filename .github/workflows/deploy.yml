name: Deploy Dine with Junn to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'content/**'
      - 'images/**'
      - 'templates/**'
      - 'static/**'
      - 'pipeline/**'
      - 'scripts/**'
      - 'config.json'
      - 'requirements.txt'
      - '.github/workflows/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  validate-build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt ruff

      - name: Lint Code Quality (Ruff)
        run: |
          ruff check --select E9,F63,F7,F82 pipeline/ scripts/

      - name: Validate Markdown & Image Assets
        run: |
          python scripts/validate.py

      - name: Build Static Site & CSVs
        run: |
          python scripts/cli.py build --csv

      - name: Commit and Push Generated CSVs
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "No changes in data/ to commit."
          else
            git commit -m "Auto-generate CSVs [skip ci]"
            git push origin main
          fi

      - name: Setup GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5

      - name: Upload /dist Artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist/'

      - name: Deploy to GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: deployment
        uses: actions/deploy-pages@v4
