name: Generate CSVs and Build Site

on:
  push:
    branches:
      - main
    paths:
      - 'content/**'
      - 'pipeline/**'
      - 'templates/**'
      - 'themes/**'
      - 'static/**'
      - 'requirements.txt'
      - 'config.json'
      - '.github/workflows/generate_csv.yml'
  workflow_dispatch:

concurrency:
  group: build-and-csv
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Build (Site & CSVs)
        run: |
          python scripts/cli.py build

      - name: Commit and push generated CSVs and dist
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"

          git add data/ dist/

          if git diff --staged --quiet; then
            echo "No changes in data/ or dist/ to commit."
          else
            git commit -m "Auto-generate CSVs and site build [skip ci]"
            git push origin main
          fi
